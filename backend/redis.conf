# Redis configuration for Ratetui Rate Limiter
# Optimized for persistence and rate limiting workloads

# ===========================================
# GENERAL
# ===========================================

# Accept connections on all interfaces
bind 0.0.0.0

# Default port
port 6379

# TCP backlog
tcp-backlog 511

# TCP keepalive
tcp-keepalive 300

# Timeout for idle clients (0 = no timeout)
timeout 0

# ===========================================
# PERSISTENCE
# ===========================================

# Enable AOF (Append Only File) persistence for durability
# AOF provides better durability than RDB snapshots
appendonly yes
appendfilename "appendonly.aof"

# AOF fsync policy
# no: don't fsync (fastest, but can lose data)
# always: fsync every write (safest, but slow)  
# everysec: fsync every second (good balance - recommended for production)
appendfsync everysec

# Auto-rewrite AOF when it grows too large to optimize disk usage
# Rewrite when AOF file is 100% larger than base size
auto-aof-rewrite-percentage 100
# Minimum size before triggering auto-rewrite
auto-aof-rewrite-min-size 64mb

# Load truncated AOF on startup (handles graceful corruption recovery)
aof-load-truncated yes

# Use RDB preamble in AOF rewrite for faster loading
# Combines RDB snapshot format with AOF log for best of both worlds
aof-use-rdb-preamble yes

# Disable RDB snapshots when using AOF (cleaner approach for production)
# AOF provides better durability and point-in-time recovery
save ""

# RDB filename (kept for manual SAVE commands if needed)
dbfilename dump.rdb

# Directory for persistence files
dir /data

# Stop writes on BGSAVE error to prevent data inconsistency
stop-writes-on-bgsave-error yes

# Enable RDB compression to save disk space
rdbcompression yes

# Checksum RDB files for data integrity
rdbchecksum yes

# ===========================================
# MEMORY MANAGEMENT
# ===========================================

# Maximum memory (256MB for rate limiting should be sufficient)
maxmemory 256mb

# Eviction policy when memory limit is reached
# allkeys-lru: Remove least recently used keys (good for rate limiting)
maxmemory-policy allkeys-lru

# Number of samples to use for LRU algorithm
maxmemory-samples 5

# ===========================================
# LOGGING
# ===========================================

# Log level: debug, verbose, notice, warning
loglevel notice

# Log file (empty for stdout)
logfile ""

# ===========================================
# DATABASES
# ===========================================

# Number of databases (0-15)
databases 16

# ===========================================
# SECURITY
# ===========================================

# Require AUTH (password set via environment variable in docker-compose)
# requirepass will be dynamically set via REDIS_PASSWORD env var

# Protected mode - requires password or bind to localhost only
protected-mode yes

# Disable dangerous commands in production to prevent accidental data loss
# Uncomment these in production environments:
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command KEYS ""
# rename-command CONFIG ""
# rename-command SHUTDOWN ""
# rename-command DEBUG ""

# Lazy freeing for better performance on key deletion
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

# Replication and AOF background processes
# Use child process for AOF rewrite with copy-on-write
aof-rewrite-incremental-fsync yes

# IO threads for better multi-core utilization (Redis 6.0+)
# Uncomment and adjust for production with multiple cores
# io-threads 4
# io-threads-do-readsaccess control in production
# Default user enabled (will require password)
# Additional ACL rules can be configured via external ACL file

# ===========================================
# PERFORMANCE
# ===========================================

# Enable RDB/AOF compression
rdbcompression yes

# Stop writes if RDB snapshots fail
stop-writes-on-bgsave-error yes

# ===========================================
# RATE LIMITING OPTIMIZATIONS
# ===========================================

# Hash table optimization for small sets (good for rate limit counters)
hash-max-ziplist-entries 512
hash-max-ziplist-value 64

# Set table optimization
set-max-intset-entries 512

# Sorted set optimization (used by rate-limiter-flexible)
zset-max-ziplist-entries 128
zset-max-ziplist-value 64